<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rostami Lab — University of Bath</title>
  <meta name="description" content="Research group at the University of Bath working on 2D materials, quantum transport, and light–matter interactions." />
  <meta property="og:title" content="Rostami Lab — University of Bath" />
  <meta property="og:description" content="Research on 2D materials, nonlinear optics, and quantum transport." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/og-image.jpg" />
  <link rel="icon" href="assets/favicon.png" />
  <style>
    /* ===== Theme variables ===== */
    :root{
      --bg:#ffffff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#475569;
      --brand:#2563eb;
      --accent:#a78bfa;
      --ring:#0ea5a4;
      --border:#eaeaea;
      --max:1100px;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      height:100%;overflow:hidden;
    }

    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline}

    .wrap{max-width:var(--max);margin:0 auto;padding:0 1rem}

    /* ===== Layout: sidebar + content ===== */
    .layout{
      display:flex;
      min-height:100vh;
    }

    main.wrap{
      flex:1;
      height:100vh;
      overflow:hidden;
    }
    main.wrap>section{
      display:none;
      height:100%;
      overflow:auto;
    }
    main.wrap>section.active{display:block}

    /* ===== Sidebar navigation ===== */
    .sidebar{
      flex:0 0 220px;
      border-right:1px solid var(--border);
      background:#f9fafb;
      padding:1rem;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
    }

    .brand{
      display:flex;
      gap:.75rem;
      align-items:center;
      font-weight:700;
      color:var(--text);
      text-decoration:none;
    }
    .brand:hover{text-decoration:none}

    .brand-logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,var(--brand),var(--accent));
      box-shadow:0 0 0 2px #00000014;
    }

    .nav-links{
      display:flex;
      flex-direction:column;
      gap:.25rem;
    }

    .nav-link{
      display:block;
      padding:.35rem .55rem;
      border-radius:8px;
      border:1px solid transparent;
      font-size:.95rem;
      color:var(--muted);
    }

    .nav-link:hover{
      background:#f3f4f6;
      text-decoration:none;
    }

    .nav-link.active{
      color:var(--brand);
      background:#eff6ff;
      border-color:#dbeafe;
      font-weight:600;
    }

    /* ===== Mobile: stack, still vertical menu ===== */
    @media (max-width:820px){
      .layout{
        flex-direction:column;
      }
      .sidebar{
        flex:0 0 auto;
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border);
      }
      .nav-links{
        flex-direction:row;
        flex-wrap:wrap;
        gap:.35rem;
      }
      .nav-link{
        padding:.25rem .6rem;
      }
      main.wrap{
        height:calc(100vh - 140px); /* room for sidebar on small screens */
      }
    }

    /* ===== Sections / cards ===== */
    section{
      padding:1.5rem 0 2.25rem;
      border-top:1px solid var(--border);
    }
    h2{font-size:1.5rem;margin:0 0 1rem}

    .hero{padding-top:1.25rem}
    .hero h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;margin:.25rem 0}
    .hero p{color:var(--muted);max-width:60ch;margin:.5rem 0 1rem}
    .cta{display:flex;gap:.75rem;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:.5rem;padding:.6rem .95rem;
      border-radius:12px;border:1px solid var(--border);background:#f6f7f9;color:var(--text)
    }
    .btn.primary{background:linear-gradient(135deg,var(--brand),var(--accent));color:#0b1020;font-weight:700}

    .grid{display:grid;gap:1rem}
    .grid.cols-3{grid-template-columns:repeat(3,1fr)}
    .grid.cols-2{grid-template-columns:repeat(2,1fr)}
    @media (max-width:900px){.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}}

    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1rem}
    .card h3{margin:.25rem 0 .5rem;font-size:1.05rem}
    .meta{color:var(--muted);font-size:.95rem}

    .people .person{display:flex;gap:1rem;align-items:flex-start}
    .avatar{flex:0 0 192px;width:192px;height:192px;border-radius:24px;background:#f3f5f7;object-fit:cover}

    footer{padding:2rem 0;color:var(--muted)}
    .fine{font-size:.9rem}
    .tag{
      display:inline-block;font-size:.8rem;padding:.2rem .5rem;border:1px solid var(--border);
      border-radius:999px;margin-left:.5rem;color:var(--muted)
    }
    .pill{
      display:inline-block;background:#fafafa;border:1px solid var(--border);
      border-radius:999px;padding:.2rem .55rem;font-size:.8rem
    }
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Roboto Mono",monospace;background:#fafafa;border:1px solid var(--border);border-radius:8px;padding:.15rem .35rem;font-size:.85rem}
    .note{border-left:3px solid var(--ring);padding:.75rem 1rem;background:#eefaf8;border-radius:10px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}

    /* ===== Funders ===== */
    .funders{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)}
    .funders h3{margin:.25rem 0 .75rem;font-size:1rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
    .logos{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .logos a{
      display:inline-flex;align-items:center;justify-content:center;
      height:96px;padding:1rem 1.25rem;border-radius:12px;
      background:#ffffff;border:1px solid var(--border)
    }
    .logos img{
      max-height:64px;max-width:240px;
      filter:grayscale(1) contrast(.9) opacity(.9);
      transition:filter .2s ease,opacity .2s ease
    }
    .logos img:hover{filter:none;opacity:1}

    /* ===== Highlights ===== */
    .highlights{margin-top:1.5rem}
    .highlight-grid{display:grid;gap:1rem;grid-template-columns:repeat(3,1fr)}
    @media (max-width:900px){.highlight-grid{grid-template-columns:1fr}}
    .highlight-card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
    .highlight-card img{display:block;width:100%;height:160px;object-fit:cover}
    .highlight-card .body{padding:0.85rem}
    .highlight-card h3{margin:.25rem 0 .35rem;font-size:1.05rem}
    .highlight-card p{margin:0;color:var(--muted)}
  </style>
</head>
